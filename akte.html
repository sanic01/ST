<!DOCTYPE html>
<html lang="de" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klon Guard - Akten Terminal</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        guard: {
                            red: '#8B0000',
                            brightRed: '#DC143C',
                            dark: '#0A0B0E',
                            card: '#12141A',
                            border: '#1E222D',
                            text: '#E1E7EF'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Lucide Icons & Fonts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #0A0B0E;
            color: #E1E7EF;
        }
        .font-orbitron {
            font-family: 'Orbitron', sans-serif;
        }
        /* Eigene Klasse für automatischen Zeilenumbruch bei langen Wörtern */
        .force-break {
            overflow-wrap: anywhere;
            word-break: break-word;
        }
        /* Textkürzung nach 2 Zeilen */
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col bg-guard-dark text-guard-text">

    <!-- Header Navigation -->
    <header class="border-b border-guard-border bg-guard-card/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <i data-lucide="shield" class="w-8 h-8 text-guard-brightRed"></i>
                <span class="font-orbitron font-bold text-xl tracking-wider text-white">KLON GUARD <span class="text-guard-brightRed">AKTEN</span></span>
            </div>
            
            <a href="index.html" class="flex items-center space-x-2 bg-guard-border/50 hover:bg-guard-border px-4 py-2 rounded text-sm transition">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
                <span>Hauptterminal</span>
            </a>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6 space-y-6">
        
        <!-- Controls & Suche -->
        <div class="flex flex-col md:flex-row gap-4 justify-between items-start md:items-center bg-guard-card p-4 rounded-lg border border-guard-border">
            <div class="relative w-full md:w-96">
                <i data-lucide="search" class="absolute left-3 top-2.5 w-4 h-4 text-gray-400"></i>
                <input type="text" id="searchInput" placeholder="Suche nach Name, ID oder Vergehen..." 
                       class="w-full bg-guard-dark border border-guard-border rounded pl-9 pr-4 py-2 text-sm focus:outline-none focus:border-guard-brightRed text-white">
            </div>
            
            <button id="btnNewRecord" onclick="openNewRecordModal()" class="w-full md:w-auto bg-guard-brightRed hover:bg-red-700 text-white px-4 py-2 rounded text-sm font-semibold flex items-center justify-center space-x-2 transition">
                <i data-lucide="plus-circle" class="w-4 h-4"></i>
                <span>Neue Akte anlegen</span>
            </button>
        </div>

        <!-- Akten Raster (Grid) -->
        <div id="recordsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            <!-- Dynamisch befüllt über Firestore -->
        </div>

    </main>

    <!-- Modal: Neue Akte anlegen -->
    <div id="newRecordModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-guard-card border border-guard-border rounded-lg max-w-lg w-full p-6 space-y-4">
            <div class="flex justify-between items-center border-b border-guard-border pb-3">
                <h3 class="font-orbitron font-bold text-lg text-white">Neue Akte Erstellen</h3>
                <button onclick="closeNewRecordModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
            </div>
            
            <form id="recordForm" onsubmit="saveRecord(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Subjekt (ID / Name)</label>
                    <input type="text" id="targetName" required placeholder="z.B. CT-9028 Test" class="w-full bg-guard-dark border border-guard-border rounded p-2 text-sm focus:outline-none focus:border-guard-brightRed">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Status</label>
                        <select id="recordStatus" class="w-full bg-guard-dark border border-guard-border rounded p-2 text-sm focus:outline-none focus:border-guard-brightRed">
                            <option value="INHAFTIERT">INHAFTIERT</option>
                            <option value="GESUCHT">GESUCHT</option>
                            <option value="VERWARNUNG">VERWARNUNG</option>
                            <option value="ERLEDIGT">ERLEDIGT</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">Strafe/Haftzeit</label>
                        <input type="text" id="recordPenalty" placeholder="z.B. 10 Min / 500 Credits" class="w-full bg-guard-dark border border-guard-border rounded p-2 text-sm focus:outline-none focus:border-guard-brightRed">
                    </div>
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Vergehen</label>
                    <input type="text" id="recordOffense" required placeholder="z.B. 8.5 Mord" class="w-full bg-guard-dark border border-guard-border rounded p-2 text-sm focus:outline-none focus:border-guard-brightRed">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Beschreibung / Notizen</label>
                    <textarea id="recordNotes" rows="4" placeholder="Detaillierte Schilderung des Vorfalls..." class="w-full bg-guard-dark border border-guard-border rounded p-2 text-sm focus:outline-none focus:border-guard-brightRed"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeNewRecordModal()" class="px-4 py-2 bg-guard-border rounded text-sm hover:bg-gray-700">Abbrechen</button>
                    <button type="submit" class="px-4 py-2 bg-guard-brightRed hover:bg-red-700 text-white rounded text-sm font-semibold">Akte Speichern</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal: Akte Detail-Ansicht -->
    <div id="detailModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-guard-card border border-guard-border rounded-lg max-w-2xl w-full p-6 space-y-4">
            <div class="flex justify-between items-start border-b border-guard-border pb-3">
                <div>
                    <div class="flex items-center space-x-3">
                        <h3 id="detailTarget" class="font-orbitron font-bold text-xl text-white"></h3>
                        <span id="detailStatusBadge" class="px-2 py-0.5 text-xs font-semibold rounded border"></span>
                    </div>
                    <p class="text-xs text-gray-400 mt-1">Erstellt von: <span id="detailOfficer" class="text-gray-200"></span></p>
                </div>
                <button onclick="closeDetailModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <div class="space-y-3 py-2">
                <div>
                    <span class="text-xs text-gray-400 block">Vergehen:</span>
                    <p id="detailOffense" class="text-white font-medium force-break"></p>
                </div>
                <div>
                    <span class="text-xs text-gray-400 block">Strafe / Haft:</span>
                    <p id="detailPenalty" class="text-white force-break"></p>
                </div>
                <div class="border-t border-guard-border/50 pt-3">
                    <span class="text-xs text-gray-400 block mb-1">Vollständige Beschreibung / Notizen:</span>
                    <div id="detailNotes" class="bg-guard-dark p-3 rounded text-sm text-gray-300 force-break whitespace-pre-wrap max-h-60 overflow-y-auto"></div>
                </div>
            </div>

            <div class="flex justify-between items-center border-t border-guard-border pt-3">
                <button id="btnDeleteDetail" class="bg-red-900/40 hover:bg-red-800/60 text-red-400 border border-red-800 px-3 py-1.5 rounded text-sm flex items-center space-x-1.5 transition">
                    <i data-lucide="trash-2" class="w-4 h-4"></i>
                    <span>Akte Löschen</span>
                </button>
                <button onclick="closeDetailModal()" class="px-4 py-2 bg-guard-border hover:bg-gray-700 rounded text-sm">Schließen</button>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAp3If3RjAzS4gG8sfKiwhnBgCOmXsGiEo",
            authDomain: "klon-guard.firebaseapp.com",
            projectId: "klon-guard",
            storageBucket: "klon-guard.firebasestorage.app",
            messagingSenderId: "8951878701",
            appId: "1:8951878701:web:c0a44b5a0d98eca23514a4",
            measurementId: "G-HJR08W0QGF"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let recordsData = [];
        let currentUser = null;

        // Auth Check
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadRecords();
            } else {
                // Bei lokalem Testen keinen harten Redirect erzwingen
                if (window.location.protocol.startsWith('http')) {
                    try { window.location.href = "index.html"; } catch(e){}
                }
            }
        });

        // Live Synchronisation der Akten
        function loadRecords() {
            const q = query(collection(db, "akten"), orderBy("createdAt", "desc"));
            onSnapshot(q, (snapshot) => {
                recordsData = [];
                snapshot.forEach((doc) => {
                    recordsData.push({ id: doc.id, ...doc.data() });
                });
                renderRecords(recordsData);
            });
        }

        // Akten rendern
        function renderRecords(list) {
            const container = document.getElementById("recordsGrid");
            container.innerHTML = "";

            if(list.length === 0) {
                container.innerHTML = `<div class="col-span-full text-center py-12 text-gray-500">Keine Akten gefunden.</div>`;
                return;
            }

            list.forEach((rec) => {
                const card = document.createElement("div");
                card.className = "bg-guard-card border border-guard-border hover:border-guard-brightRed/50 rounded-lg p-4 cursor-pointer transition flex flex-col justify-between space-y-3";
                
                // Klick öffnet das Detail-Modal
                card.onclick = (e) => {
                    if(!e.target.closest('.no-click')) {
                        openDetailModal(rec);
                    }
                };

                const statusColor = rec.status === 'INHAFTIERT' ? 'border-red-600 text-red-500 bg-red-950/30' : 'border-yellow-600 text-yellow-500 bg-yellow-950/30';

                card.innerHTML = `
                    <div>
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <h4 class="font-orbitron font-bold text-base text-white force-break">${escapeHtml(rec.target || 'Unbekannt')}</h4>
                            <span class="text-[10px] px-2 py-0.5 font-bold border rounded ${statusColor}">${escapeHtml(rec.status || 'OFFEN')}</span>
                        </div>
                        <p class="text-xs text-gray-400 mb-1 force-break"><strong class="text-gray-300">Vergehen:</strong> ${escapeHtml(rec.offense || '-')}</p>
                        <p class="text-xs text-gray-400 mb-2 force-break"><strong class="text-gray-300">Strafe/Haft:</strong> ${escapeHtml(rec.penalty || '-')}</p>
                        
                        ${rec.notes ? `<p class="text-xs text-gray-400 italic bg-guard-dark/50 p-2 rounded force-break line-clamp-2">"${escapeHtml(rec.notes)}"</p>` : ''}
                    </div>

                    <div class="flex justify-between items-center text-[11px] text-gray-500 border-t border-guard-border/40 pt-2">
                        <span>Offizier: ${escapeHtml(rec.officer || 'Unbekannt')}</span>
                        <button onclick="event.stopPropagation(); deleteRecord('${rec.id}')" class="no-click text-red-500 hover:text-red-400 flex items-center space-x-1 p-1">
                            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                            <span>Löschen</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });

            if (window.lucide) lucide.createIcons();
        }

        // Suche
        document.getElementById("searchInput").addEventListener("input", (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = recordsData.filter(r => 
                (r.target && r.target.toLowerCase().includes(val)) ||
                (r.offense && r.offense.toLowerCase().includes(val)) ||
                (r.officer && r.officer.toLowerCase().includes(val))
            );
            renderRecords(filtered);
        });

        // Modals Steuerung
        window.openNewRecordModal = () => document.getElementById("newRecordModal").classList.remove("hidden");
        window.closeNewRecordModal = () => document.getElementById("newRecordModal").classList.add("hidden");

        window.openDetailModal = (rec) => {
            document.getElementById("detailTarget").innerText = rec.target || 'Unbekannt';
            document.getElementById("detailOffense").innerText = rec.offense || '-';
            document.getElementById("detailPenalty").innerText = rec.penalty || '-';
            document.getElementById("detailNotes").innerText = rec.notes || 'Keine Notizen vorhanden.';
            document.getElementById("detailOfficer").innerText = rec.officer || 'Unbekannt';
            
            const badge = document.getElementById("detailStatusBadge");
            badge.innerText = rec.status || 'OFFEN';
            badge.className = `px-2 py-0.5 text-xs font-semibold rounded border ${rec.status === 'INHAFTIERT' ? 'border-red-600 text-red-500 bg-red-950/30' : 'border-yellow-600 text-yellow-500 bg-yellow-950/30'}`;

            document.getElementById("btnDeleteDetail").onclick = () => {
                deleteRecord(rec.id);
                closeDetailModal();
            };

            document.getElementById("detailModal").classList.remove("hidden");
        };

        window.closeDetailModal = () => document.getElementById("detailModal").classList.add("hidden");

        // Neue Akte speichern
        window.saveRecord = async (e) => {
            e.preventDefault();
            const target = document.getElementById("targetName").value;
            const status = document.getElementById("recordStatus").value;
            const penalty = document.getElementById("recordPenalty").value;
            const offense = document.getElementById("recordOffense").value;
            const notes = document.getElementById("recordNotes").value;

            try {
                await addDoc(collection(db, "akten"), {
                    target,
                    status,
                    penalty,
                    offense,
                    notes,
                    officer: currentUser?.displayName || currentUser?.email?.split('@')[0] || "Guard Offizier",
                    createdAt: serverTimestamp()
                });
                closeNewRecordModal();
                document.getElementById("recordForm").reset();
            } catch (err) {
                alert("Fehler beim Speichern: " + err.message);
            }
        };

        // Akte löschen
        window.deleteRecord = async (id) => {
            if(confirm("Möchtest du diese Akte wirklich unwiderruflich löschen?")) {
                try {
                    await deleteDoc(doc(db, "akten", id));
                } catch(err) {
                    alert("Fehler beim Löschen: " + err.message);
                }
            }
        };

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        window.onload = () => { if (window.lucide) lucide.createIcons(); };
    </script>
</body>
</html>
